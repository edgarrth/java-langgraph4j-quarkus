quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.http.access-log.enabled=false
quarkus.swagger-ui.always-include=true
payments.checkpoints=${CHECKPOINT_DIR:.runtime/checkpoints}
payments.integration-url=${INTEGRATION_URL:http://localhost:8081}
payments.api-key=${API_KEY:local-demo-key}
quarkus.log.category."org.bsc.langgraph4j".level=WARN
payments.simulator-delay-ms=${SIMULATOR_DELAY_MS:300}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:axiz}
quarkus.datasource.password=${DB_PASSWORD:axiz-local-password}
quarkus.datasource.jdbc.url=${JDBC_URL:jdbc:postgresql://localhost:5432/axiz_copilot}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/axiz
copilot.provider=${AI_PROVIDER:OPENAI}
copilot.openai-key=${OPENAI_API_KEY:}
copilot.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
copilot.chat-model=${OPENAI_CHAT_MODEL:gpt-5-mini}
copilot.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
copilot.embedding-dimensions=${EMBEDDING_DIMENSIONS:1536}
copilot.model-timeout-seconds=${MODEL_TIMEOUT_SECONDS:90}
copilot.api-keys=${COPILOT_API_KEYS:tenant-pe-01:local-demo-key,tenant-other:other-demo-key}
copilot.reviewer-key=${REVIEWER_KEY:local-reviewer-key}
copilot.qdrant-url=${QDRANT_URL:http://localhost:6333}
copilot.qdrant-key=${QDRANT_API_KEY:}
copilot.collection=${QDRANT_COLLECTION:axiz_payment_knowledge_v2}
copilot.top-k=${RAG_TOP_K:6}
copilot.threshold=${RAG_THRESHOLD:0.45}
copilot.chunk-tokens=${CHUNK_TOKENS:500}
copilot.overlap-tokens=${CHUNK_OVERLAP:60}
copilot.memory-window=${MEMORY_WINDOW:14}
copilot.bootstrap-enabled=${BOOTSTRAP_ENABLED:true}
quarkus.log.category."dev.langchain4j".level=WARN
